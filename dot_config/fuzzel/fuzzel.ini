[main]
font=JetBrainsMono Nerd Font:size=18
terminal=foot
# sway's default focus_follows_mouse means the cursor stays wherever it was
# when fuzzel was launched (e.g. over waybar), not over the centered fuzzel
# window - without this, fuzzel's default exit-on-keyboard-focus-loss=yes
# closes it immediately since it never holds focus under the cursor.
exit-on-keyboard-focus-loss=no

[colors]
background=1e1e2eee
text=cdd6f4ff
match=f9e2afff
selection=45475aff
selection-text=cdd6f4ff
border=89b4faff

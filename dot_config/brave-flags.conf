# Force PipeWire-based screen capture so Window/Entire Screen sharing works
# under sway via xdg-desktop-portal-wlr (see commit d6a9db0).
--enable-features=WebRTCPipeWireCapturer
--ozone-platform-hint=auto

# Dark browser UI (chrome, not page content) - independent of GTK theme
# detection, which Brave doesn't reliably follow under a bare Sway session.
--force-dark-mode
